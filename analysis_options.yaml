# Konfigurasi analyzer Sangu. Lint set: very_good_analysis (R100.1,
# ADR-014). File hasil generate (*.g.dart, *.freezed.dart) di-exclude
# (R100.14) — jangan diedit tangan, edit sumbernya lalu build_runner.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Belum ada override — very_good_analysis dipakai apa adanya.
    # Tambah pengecualian di sini kalau perlu, beserta alasan (R000.2).
